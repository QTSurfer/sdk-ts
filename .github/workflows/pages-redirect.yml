name: Pages redirect

# The reference documentation of this project is published on www.qtsurfer.com. The GitHub Pages site of
# this repository only redirects there, so that the links already published in package metadata and
# release notes keep working. The pages to serve are in pages-redirect/.
on:
  push:
    branches: [main]
    paths:
      - pages-redirect/**
      - .github/workflows/pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deploy
        uses: actions/deploy-pages@v4
