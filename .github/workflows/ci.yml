name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    needs: unit
    runs-on: ubuntu-latest
    # Environment provides QTSURFER_API_URL (variable) and JWT_API_TOKEN (secret).
    environment: Preproduction
    # Skip on forks — secrets are never exposed to forks.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run integration test
        env:
          JWT_API_TOKEN: ${{ secrets.JWT_API_TOKEN }}
          QTSURFER_API_URL: ${{ vars.QTSURFER_API_URL }}
        run: |
          if [ -z "$JWT_API_TOKEN" ]; then
            echo "::warning::JWT_API_TOKEN not configured in the Preproduction environment; skipping."
            exit 0
          fi
          npm run test:integration

  docs:
    needs: unit
    runs-on: ubuntu-latest
    # Only tagged versions get published, so the site always describes a release
    # rather than whatever main happens to be.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
